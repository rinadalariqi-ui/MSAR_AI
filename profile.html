{% extends "base.html" %}{% block content %}<section class="pagehead"><span class="eyebrow">ملفك هو نقطة البداية</span><h1>خلّنا نتعرّف <em>على طموحك</em></h1><p>أدخل بياناتك الأساسية حتى نقدر نقارنها بشروط المنح المتاحة.</p></section><form class="profile-form" method="post"><label>الاسم الكامل<input name="full_name" required value="{{p.get('full_name','')}}"></label><label>التخصص<input name="major" required value="{{p.get('major','')}}" placeholder="مثال: علوم البيانات"></label><label>مؤهلك الحالي<select name="degree_level">{% for x in ['High School','Diploma','Bachelor','Master','PhD'] %}<option {% if p.get('degree_level','Bachelor')==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label>المرحلة المستهدفة<select name="preferred_study_level">{% for x in ['Bachelor','Master','PhD'] %}<option {% if p.get('preferred_study_level','Master')==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label>المعدل<input name="gpa" type="number" step="0.01" min="0" value="{{p.get('gpa',0)}}"></label><label>مقياس المعدل<select name="gpa_scale">{% for x in ['4.0','5.0','100'] %}<option {% if p.get('gpa_scale','4.0')==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label>الدولة المفضلة<input name="target_country" value="{{p.get('target_country','Any')}}"></label><label>اختبار اللغة<select name="english_test"><option value="">لا يوجد</option><option>IELTS</option><option>TOEFL</option></select></label><label>درجة الاختبار<input name="english_score" type="number" step=".5" value="{{p.get('english_score') or ''}}"></label><div class="form-actions"><button>حفظ الملف وعرض فرصي</button><span>يُحفظ الملف محليًا على جهازك في هذه النسخة.</span></div></form>{% endblock %}
